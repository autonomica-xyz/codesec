# Per-stage configuration. Model diversity between Hunt and Validate is
# load-bearing: it implements the blog's "deliberate disagreement" rule.
# Trace runs on Opus because the paper calls it "the stage that matters most."

defaults:
  max_turns: 25
  permission_mode: acceptEdits   # never bypassPermissions
  repair_attempts: 1             # one re-emit chance on schema-validation failure

stages:
  recon:
    model: claude-opus-4-7
    concurrency: 1
    tools: [Read, Grep, Glob, Bash]
    max_turns: 60                # recon can be long
    repair_attempts: 2           # critical one-shot; spend a second repair turn if needed
  hunt:
    model: claude-sonnet-4-6
    concurrency: 50
    tools: [Read, Grep, Glob, Bash]
    hints_in_hunt: true           # W4: inject per-CWE bypass hints into task input
    policies: false               # W11: per-task search-mode policies (ablation-flagged)
  validate:
    model: claude-opus-4-7        # different from hunt — deliberate disagreement
    concurrency: 10
    tools: [Read, Grep, Glob]     # no Bash: pure analysis
    rounds: 2                     # panel: 2 independent reviews, then an arbiter ruling
    panel_projection: true        # W1: panel sees falsifiable fields only (not finder's confidence)
    hints_all_rounds: false       # W4: bypass hints from round >=2; true = every round
  gapfill:
    model: claude-sonnet-4-6
    concurrency: 1
    tools: [Read, Grep, Glob]
    repair_attempts: 2
    negative_knowledge: true      # W9: drop proposed tasks that re-try refuted (class,file)
  dedupe:
    model: claude-sonnet-4-6
    concurrency: 1
    tools: [Read]
  trace:
    model: claude-opus-4-7        # most critical stage
    concurrency: 10
    tools: [Read, Grep, Glob, Bash]
    canary_markers: true          # W6: exact-marker verification when live_target set
    require_canary_marker: true   # W6: reachable requires marker.verified when applicable
  feedback:
    model: claude-sonnet-4-6
    concurrency: 1
    tools: [Read, Grep, Glob]
    repair_attempts: 2
  report:
    model: claude-sonnet-4-6
    concurrency: 1
    tools: [Read]
    grade: false                  # W12: post-report demote-only grader (adds cost)

# Bounded loops to prevent runaway cost
loops:
  gapfill_iterations: 2     # max Hunt → Validate → Gapfill cycles
  feedback_iterations: 1    # one feedback pass after Trace
